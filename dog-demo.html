<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dog Age Calculator Demo — Hassan Mahmoud</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #c9d1d9; font-family: 'Inter', sans-serif; min-height: 100vh; padding: 2rem 1rem; }
  header { text-align: center; margin-bottom: 2rem; }
  header .back { display: inline-block; color: #58a6ff; text-decoration: none; font-size: 0.85rem; margin-bottom: 1rem; font-family: 'JetBrains Mono', monospace; }
  header h1 { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; color: #f0f6fc; font-weight: 700; }
  header p { color: #8b949e; font-size: 0.9rem; margin-top: 0.4rem; }
  .terminal { max-width: 700px; margin: 0 auto; background: #161b22; border: 1px solid #30363d; border-radius: 10px; overflow: hidden; }
  .terminal-bar { background: #21262d; padding: 0.6rem 1rem; display: flex; align-items: center; gap: 0.5rem; border-bottom: 1px solid #30363d; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.red { background: #ff5f57; } .dot.yellow { background: #febc2e; } .dot.green { background: #28c840; }
  .terminal-title { flex: 1; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: #8b949e; }
  .output { padding: 1.2rem; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; line-height: 1.7; min-height: 300px; max-height: 420px; overflow-y: auto; }
  .output .line { margin-bottom: 0.1rem; }
  .output .prompt { color: #3fb950; } .output .info { color: #79c0ff; } .output .warn { color: #f0883e; } .output .err { color: #ff7b72; } .output .sep { color: #30363d; }
  .input-row { display: flex; align-items: center; border-top: 1px solid #30363d; padding: 0.8rem 1.2rem; gap: 0.6rem; }
  .input-row span { font-family: 'JetBrains Mono', monospace; color: #3fb950; font-size: 0.85rem; white-space: nowrap; }
  .input-row input { flex: 1; background: transparent; border: none; outline: none; color: #f0f6fc; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; }
  .input-row button { background: #238636; color: #fff; border: none; border-radius: 6px; padding: 0.35rem 0.9rem; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; cursor: pointer; transition: background 0.15s; }
  .input-row button:hover { background: #2ea043; }
  .hint { max-width: 700px; margin: 1rem auto 0; text-align: center; font-size: 0.8rem; color: #8b949e; font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
<header>
  <a class="back" href="resume(1)">← Back to Resume</a>
  <h1>// Dog Age Calculator</h1>
  <p>Interactive demo — C project by Hassan Mahmoud</p>
</header>
<div class="terminal">
  <div class="terminal-bar">
    <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
    <div class="terminal-title">dog-demo.exe</div>
  </div>
  <div class="output" id="output"></div>
  <div class="input-row">
    <span>$&gt;</span>
    <input type="text" id="userInput" placeholder="Type your input here..." autocomplete="off" />
    <button onclick="submitInput()">Enter</button>
  </div>
</div>
<div class="hint">Press Enter or click the button to submit input</div>

<script>
  let dogs = [];
  let state = 'ask_count';
  let count = 0;
  let current = 0;
  let buffer = {};

  const out = document.getElementById('output');
  const inp = document.getElementById('userInput');
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') submitInput(); });

  function print(text, cls = '') {
    const d = document.createElement('div');
    d.className = 'line' + (cls ? ' ' + cls : '');
    d.textContent = text;
    out.appendChild(d);
    out.scrollTop = out.scrollHeight;
  }

  function dogAge(weight, age) {
    if (weight <= 20) {
      if (age === 1) return { type: 'Small', dogAge: 15 };
      if (age === 2) return { type: 'Small', dogAge: 23 };
      if (age === 3) return { type: 'Small', dogAge: 28 };
      return { type: 'Small', dogAge: 28 + 4 * (age - 3) };
    } else if (weight <= 50) {
      if (age === 1) return { type: 'Medium', dogAge: 14 };
      if (age === 2) return { type: 'Medium', dogAge: 23 };
      if (age === 3) return { type: 'Medium', dogAge: 30 };
      return { type: 'Medium', dogAge: 30 + 5 * (age - 3) };
    } else {
      if (age === 1) return { type: 'Large', dogAge: 12 };
      if (age === 2) return { type: 'Large', dogAge: 21 };
      if (age === 3) return { type: 'Large', dogAge: 29 };
      return { type: 'Large', dogAge: 29 + 7 * (age - 3) };
    }
  }

  function displayResults() {
    print('');
    print('┌─────────────────┬────────────┬──────────────┬─────────────┐', 'sep');
    print('│ Dog Name        │ Size       │ Human Years  │ Dog Years   │', 'info');
    print('├─────────────────┼────────────┼──────────────┼─────────────┤', 'sep');
    dogs.forEach(d => {
      const name = d.name.padEnd(15);
      const type = d.type.padEnd(10);
      const human = String(d.age).padEnd(12);
      const dog = String(d.dogAge).padEnd(11);
      print('│ ' + name + ' │ ' + type + ' │ ' + human + ' │ ' + dog + ' │');
    });
    print('└─────────────────┴────────────┴──────────────┴─────────────┘', 'sep');
    print('');
    print('Enter "restart" to run again.', 'prompt');
    state = 'done';
  }

  function submitInput() {
    const val = inp.value.trim();
    if (!val) return;
    print('$ ' + val, 'prompt');
    inp.value = '';
    handle(val);
  }

  function handle(val) {
    if (state === 'done') {
      if (val.toLowerCase() === 'restart') { dogs = []; current = 0; count = 0; print(''); boot(); }
      return;
    }
    if (state === 'ask_count') {
      const n = parseInt(val);
      if (isNaN(n) || n < 1 || n > 10) { print('Please enter a number between 1 and 10.', 'err'); return; }
      count = n; current = 0; state = 'ask_name';
      print('Dog #1 — What is the dog\'s name?', 'prompt');
      return;
    }
    if (state === 'ask_name') { buffer.name = val; state = 'ask_weight'; print('How much does ' + val + ' weigh (lbs)?', 'prompt'); return; }
    if (state === 'ask_weight') {
      const w = parseFloat(val);
      if (isNaN(w) || w <= 0) { print('Enter a valid weight.', 'err'); return; }
      buffer.weight = w; state = 'ask_age';
      print('How old is ' + buffer.name + ' in human years?', 'prompt');
      return;
    }
    if (state === 'ask_age') {
      const a = parseInt(val);
      if (isNaN(a) || a < 1) { print('Enter a valid age (1+).', 'err'); return; }
      buffer.age = a;
      const result = dogAge(buffer.weight, buffer.age);
      dogs.push({ name: buffer.name, weight: buffer.weight, age: buffer.age, ...result });
      current++;
      buffer = {};
      if (current < count) {
        state = 'ask_name';
        print('Dog #' + (current + 1) + ' — What is the dog\'s name?', 'prompt');
      } else {
        displayResults();
      }
    }
  }

  function boot() {
    print('Dog Age Calculator', 'info');
    print('C Project — Hassan Mahmoud', 'info');
    print('');
    print('How many dogs do you have? (1–10)', 'prompt');
    state = 'ask_count';
  }

  boot();
</script>
</body>
</html>
