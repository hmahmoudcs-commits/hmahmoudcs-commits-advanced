<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Athlete Program — Hassan Mahmoud</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #c9d1d9; font-family: 'Inter', sans-serif; min-height: 100vh; padding: 2rem 1rem; }
  header { text-align: center; margin-bottom: 2rem; }
  header .back { display: inline-block; color: #58a6ff; text-decoration: none; font-size: 0.85rem; margin-bottom: 1rem; font-family: 'JetBrains Mono', monospace; }
  header h1 { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; color: #f0f6fc; font-weight: 700; }
  header p { color: #8b949e; font-size: 0.9rem; margin-top: 0.4rem; }
  .terminal { max-width: 700px; margin: 0 auto; background: #161b22; border: 1px solid #30363d; border-radius: 10px; overflow: hidden; }
  .terminal-bar { background: #21262d; padding: 0.6rem 1rem; display: flex; align-items: center; gap: 0.5rem; border-bottom: 1px solid #30363d; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.red { background: #ff5f57; } .dot.yellow { background: #febc2e; } .dot.green { background: #28c840; }
  .terminal-title { flex: 1; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: #8b949e; }
  .output { padding: 1.2rem; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; line-height: 1.7; min-height: 300px; max-height: 440px; overflow-y: auto; }
  .output .line { margin-bottom: 0.1rem; }
  .output .prompt { color: #3fb950; } .output .info { color: #79c0ff; } .output .warn { color: #f0883e; } .output .err { color: #ff7b72; } .output .sep { color: #30363d; }
  .input-row { display: flex; align-items: center; border-top: 1px solid #30363d; padding: 0.8rem 1.2rem; gap: 0.6rem; }
  .input-row span { font-family: 'JetBrains Mono', monospace; color: #3fb950; font-size: 0.85rem; white-space: nowrap; }
  .input-row input { flex: 1; background: transparent; border: none; outline: none; color: #f0f6fc; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; }
  .input-row button { background: #238636; color: #fff; border: none; border-radius: 6px; padding: 0.35rem 0.9rem; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; cursor: pointer; }
  .input-row button:hover { background: #2ea043; }
  .hint { max-width: 700px; margin: 1rem auto 0; text-align: center; font-size: 0.8rem; color: #8b949e; font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
<header>
  <a class="back" href="resume">← Back to Resume</a>
  <h1>// Student Athlete Management</h1>
  <p>Interactive demo — C++ project by Hassan Mahmoud</p>
</header>
<div class="terminal">
  <div class="terminal-bar">
    <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
    <div class="terminal-title">student-athlete-demo.exe</div>
  </div>
  <div class="output" id="output"></div>
  <div class="input-row">
    <span>$&gt;</span>
    <input type="text" id="userInput" placeholder="Type your input here..." autocomplete="off" />
    <button onclick="submitInput()">Enter</button>
  </div>
</div>
<div class="hint">Press Enter or click the button to submit input</div>

<script>
  const ATHLETIC_FEE = 125.50;
  let students = [];
  let athletes = [];
  let state = 'menu';
  let addStep = 0;
  let buf = {};
  let sportLoop = false;

  const out = document.getElementById('output');
  const inp = document.getElementById('userInput');
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') submitInput(); });

  function print(text, cls = '') {
    const d = document.createElement('div');
    d.className = 'line' + (cls ? ' ' + cls : '');
    d.textContent = text;
    out.appendChild(d);
    out.scrollTop = out.scrollHeight;
  }

  function showMenu() {
    print('');
    print('Please choose from the following menu:', 'info');
    print('1: Add student', 'info');
    print('2: Print all enrolled students', 'info');
    print('3: Search student by last name', 'info');
    print('4: Print all student athletes', 'info');
    print('5: Print students by grade', 'info');
    print('6: Print athletes by sport', 'info');
    print('7: Exit program', 'info');
    print('');
    print('Enter a choice (1-7):', 'prompt');
    state = 'menu';
  }

  function submitInput() {
    const val = inp.value.trim();
    if (!val) return;
    print('$ ' + val, 'prompt');
    inp.value = '';
    handle(val);
  }

  function handle(val) {
    if (state === 'menu') {
      const c = parseInt(val);
      if (c === 1) startAdd();
      else if (c === 2) displayAll();
      else if (c === 3) { state = 'search_last'; print('Enter last name to search:', 'prompt'); }
      else if (c === 4) displayAthletes();
      else if (c === 5) { state = 'search_grade'; print('Enter grade to filter (9-12):', 'prompt'); }
      else if (c === 6) { state = 'search_sport'; print('Enter sport to filter:', 'prompt'); }
      else if (c === 7) { print('Exiting... Enter "restart" to run again.', 'warn'); state = 'done'; }
      else { print('Must be between 1-7.', 'err'); showMenu(); }
      return;
    }

    if (state === 'search_last') {
      const found = students.filter(s => s.lastName.toLowerCase() === val.toLowerCase());
      if (found.length === 0) print('No students found with last name: ' + val, 'warn');
      else found.forEach(s => printStudent(s));
      showMenu(); return;
    }

    if (state === 'search_grade') {
      const g = parseInt(val);
      const found = students.filter(s => s.grade === g);
      if (found.length === 0) print('No students in grade ' + g, 'warn');
      else found.forEach(s => printStudent(s));
      showMenu(); return;
    }

    if (state === 'search_sport') {
      const found = athletes.filter(a => a.sport.toLowerCase() === val.toLowerCase());
      if (found.length === 0) print('No athletes found for sport: ' + val, 'warn');
      else found.forEach(a => print(a.sport + '  ' + a.first + ' ' + a.last));
      showMenu(); return;
    }

    if (state === 'add') { handleAdd(val); return; }
    if (state === 'add_sport_choice') { handleSportChoice(val); return; }
    if (state === 'add_sport_name') { handleSportName(val); return; }
    if (state === 'add_more_sport') { handleMoreSport(val); return; }
    if (state === 'done') { if (val.toLowerCase() === 'restart') { students = []; athletes = []; print(''); boot(); } }
  }

  function startAdd() {
    buf = { firstName: '', lastName: '', grade: 0, totalFees: 0, sports: [] };
    addStep = 0; state = 'add';
    print('Enter first name:', 'prompt');
  }

  function handleAdd(val) {
    if (addStep === 0) { buf.firstName = val; addStep++; print('Enter last name:', 'prompt'); }
    else if (addStep === 1) { buf.lastName = val; addStep++; print('Enter grade (9-12):', 'prompt'); }
    else if (addStep === 2) {
      const g = parseInt(val);
      if (isNaN(g) || g < 9 || g > 12) { print('Must be between 9-12.', 'err'); return; }
      buf.grade = g;
      state = 'add_sport_choice';
      print('Does the student play a sport? (Y/N):', 'prompt');
    }
  }

  function handleSportChoice(val) {
    const v = val.toUpperCase();
    if (v !== 'Y' && v !== 'N') { print('Must be Y or N.', 'err'); return; }
    if (v === 'Y') { state = 'add_sport_name'; print('What sport does the student play?', 'prompt'); }
    else { finishAdd(); }
  }

  function handleSportName(val) {
    athletes.push({ first: buf.firstName, last: buf.lastName, sport: val });
    buf.totalFees += ATHLETIC_FEE;
    buf.sports.push(val);
    state = 'add_more_sport';
    print('✓ Sport added. Athletic fee: $' + ATHLETIC_FEE.toFixed(2), 'prompt');
    print('Does the student play another sport? (Y/N):', 'prompt');
  }

  function handleMoreSport(val) {
    const v = val.toUpperCase();
    if (v !== 'Y' && v !== 'N') { print('Must be Y or N.', 'err'); return; }
    if (v === 'Y') { state = 'add_sport_name'; print('What sport does the student play?', 'prompt'); }
    else { finishAdd(); }
  }

  function finishAdd() {
    students.push({ ...buf });
    print('✓ Student added: ' + buf.firstName + ' ' + buf.lastName + ' (Grade ' + buf.grade + ') — Fees: $' + buf.totalFees.toFixed(2), 'prompt');
    showMenu();
  }

  function printStudent(s) {
    print('  Grade ' + s.grade + '  ' + s.firstName + ' ' + s.lastName + '  $' + s.totalFees.toFixed(2));
  }

  function displayAll() {
    if (students.length === 0) { print('No students enrolled yet.', 'warn'); showMenu(); return; }
    print('─────────────────────────────────────────', 'sep');
    students.forEach(s => printStudent(s));
    print('─────────────────────────────────────────', 'sep');
    showMenu();
  }

  function displayAthletes() {
    if (athletes.length === 0) { print('No athletes registered yet.', 'warn'); showMenu(); return; }
    print('─────────────────────────────────────────', 'sep');
    athletes.forEach(a => print('  ' + a.sport + '  ' + a.first + ' ' + a.last));
    print('─────────────────────────────────────────', 'sep');
    showMenu();
  }

  function boot() {
    print('Student Athlete Management System', 'info');
    print('C++ Project — Hassan Mahmoud', 'info');
    print('Athletic Fee per Sport: $' + ATHLETIC_FEE.toFixed(2), 'info');
    showMenu();
  }

  boot();
</script>
</body>
</html>
